name: Build apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Regenerate platform folders
        run: flutter create --platforms=android --org dev.portallab --project-name portal_lab .

      - name: Patch Android manifest
        run: |
          cd android/app/src/main
          python3 - <<'EOF'
          import re
          p = 'AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                        '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          s = s.replace('android:label="portal_lab"', 'android:label="Portal Lab"')
          open(p, 'w').write(s)
          EOF

      - name: Disable release lint (AGP lintVital bug)
        run: |
          cd android/app
          f=$(ls build.gradle* | head -1)
          if [[ "$f" == *.kts ]]; then
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n    }\n}\n' >> "$f"
          else
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n    }\n}\n' >> "$f"
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortalLab-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate platform folders
        run: flutter create --platforms=ios --org dev.portallab --project-name portal_lab .

      - name: Patch Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Portal Lab" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/Runner/Info.plist || true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (unsigned, via xcodebuild)
        run: |
          flutter build ios --config-only --release --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath ../build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .app
        run: |
          cd build/Build/Products/Release-iphoneos
          zip -r -y PortalLab-iOS.zip Runner.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortalLab-iOS
          path: build/Build/Products/Release-iphoneos/PortalLab-iOS.zip
